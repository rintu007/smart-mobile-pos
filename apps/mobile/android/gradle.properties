org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=128m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Kotlin's incremental-compilation cache can't compute a relative path between
# files on two different drive letters on Windows (the project lives on D:,
# the Flutter/pub package cache lives on C:) -- crashes every plugin's
# compileDebugKotlin task with "this and base files have different roots".
# Disabling incremental compilation avoids it; this only affects rebuild
# speed, not build correctness.
kotlin.incremental=false
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
