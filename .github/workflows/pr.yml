name: PR Checks

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @smart-pos/web exec prisma generate
      - run: pnpm --filter @smart-pos/web lint
      - run: pnpm --filter @smart-pos/web typecheck

  unit-tests:
    needs: lint-typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @smart-pos/web exec prisma generate
      - run: pnpm --filter @smart-pos/web test

  build:
    needs: lint-typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @smart-pos/web exec prisma generate
      - run: pnpm --filter @smart-pos/web build
        env:
          # Build-time only — no live database or Supabase project needed for `next build` to
          # succeed, since no page/route in Sprint 01 queries the database at build time.
          NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "placeholder"
          DATABASE_URL: "postgresql://placeholder:placeholder@localhost:5432/placeholder"
          DIRECT_URL: "postgresql://placeholder:placeholder@localhost:5432/placeholder"
          # Added Sprint 23: core/auth/admin-client.ts constructs a Supabase client at module-load
          # time (`createClient(url, key)`), which throws synchronously ("supabaseKey is
          # required") if this is empty/undefined — found live when this build job failed on
          # Sprint 23's PR, since every route now transitively imports it via `requirePermission`.
          # A placeholder value is sufficient: `next build`'s page-data collection only constructs
          # the client, it never actually calls Supabase with it.
          SUPABASE_SERVICE_ROLE_KEY: "placeholder"

  mobile-analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
        working-directory: apps/mobile
      - run: flutter pub run build_runner build --delete-conflicting-outputs
        working-directory: apps/mobile
      - run: flutter analyze
        working-directory: apps/mobile
      - run: flutter test
        working-directory: apps/mobile

  # Sprint 40 (backlog.md M4 item 5) built this job's cross-tenant isolation suite; Sprint 41
  # (M4 item 6) added idempotent-replay/2-device concurrent-composition/the server-testable failure-
  # scenario subset to the same job, not a new one — offline-test-suite.md §2 needs no toxiproxy/new
  # infra for that subset, since replay-safety is server-observable without a real network hop (see
  # sync-idempotent-replay.test.ts's own doc comment). A `postgres:15` service container (fresh per
  # run, no shared/production database) so this genuinely blocks every PR without state pollution
  # across concurrent runs — docs/12-security/tenant-isolation.md §1's "independent of the API layer
  # being correct" is only true if the suite hits real RLS, not a mock.
  fast-integration:
    needs: lint-typecheck
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: smartpos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/smartpos_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/smartpos_test
      # Added Sprint 41 — unlike Sprint 40's suite (raw SQL only), the new sync-engine tests call
      # `pushOperations` in-process, which transitively imports `roles/service.ts` →
      # `core/auth/admin-client.ts`'s module-load-time `createClient(url, key)` call (the same
      # "supabaseKey is required" crash the `build` job's own env block already works around).
      # Placeholders only — no live Supabase project is called here, only constructed.
      NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "placeholder"
      SUPABASE_SERVICE_ROLE_KEY: "placeholder"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @smart-pos/web exec prisma generate
      - run: pnpm --filter @smart-pos/web exec prisma migrate deploy
      # Real Postgres schema/RLS, not a mock — auth-stub.sql's own doc comment explains exactly
      # what it stands in for and why (only `auth.jwt()`, the one Supabase auth function this
      # codebase's RLS policies actually call) and what it deliberately does not stand in for
      # (GoTrue/PostgREST/Realtime — this suite tests direct-connection RLS only).
      - run: node integration-tests/setup/apply-sql.mjs
        working-directory: apps/web
      - run: pnpm --filter @smart-pos/web test:integration

# Per docs/15-github-project/ci-workflows.md, this file grows incrementally: `import-boundaries`
# (dependency-cruiser) and `bundle-secret-scan` are added as the sprints that build the checks they
# run land — not stubbed here ahead of having anything real to run. `mobile-analyze-test` added
# Sprint 03, once apps/mobile had real Dart code to check (previously the directory was
# intentionally empty — see apps/mobile/README.md's Sprint-01-era note, now superseded).
# `fast-integration` added Sprint 40 (M4 item 5) — see its own job comment above.
