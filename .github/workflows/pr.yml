name: PR Checks

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @smart-pos/web lint
      - run: pnpm --filter @smart-pos/web typecheck

  unit-tests:
    needs: lint-typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @smart-pos/web test

  build:
    needs: lint-typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @smart-pos/web exec prisma generate
      - run: pnpm --filter @smart-pos/web build
        env:
          # Build-time only — no live database or Supabase project needed for `next build` to
          # succeed, since no page/route in Sprint 01 queries the database at build time.
          NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "placeholder"
          DATABASE_URL: "postgresql://placeholder:placeholder@localhost:5432/placeholder"
          DIRECT_URL: "postgresql://placeholder:placeholder@localhost:5432/placeholder"

# Per docs/15-github-project/ci-workflows.md, this file grows incrementally: `import-boundaries`
# (dependency-cruiser), `fast-integration` (cross-tenant isolation, idempotent-replay,
# 2-device composition), and `bundle-secret-scan` are added as the sprints that build the
# modules/suites they check land — not stubbed here ahead of having anything real to run.
